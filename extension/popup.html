<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=340">
  <title>VisionAdapt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #F8F9FB;
      color: #1D1D1F;
      font-size: 14px;
    }

    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px; border-bottom: 1px solid #E4E7EC;
    }
    .header .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #007AFF, #14B8A6);
      display: flex; align-items: center; justify-content: center;
    }
    .header .logo svg { width: 16px; height: 16px; stroke: #fff; fill: none; }
    .header .title { font-weight: 700; font-size: 15px; }
    .header .version { font-size: 11px; color: #6E6E73; margin-left: auto; }

    .status-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid #E4E7EC;
    }
    .pulse { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .pulse.active { background: #34C759; box-shadow: 0 0 0 3px rgba(52,199,89,.2); animation: pulseGlow 1.5s ease infinite; }
    .pulse.inactive { background: #E4E7EC; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 3px rgba(52,199,89,.2); }
      50% { box-shadow: 0 0 0 6px rgba(52,199,89,.1); }
    }
    .status-text { font-weight: 600; font-size: 13px; }
    .status-sub { font-size: 11px; color: #6E6E73; }

    .game-banner {
      display: none;
      align-items: center; gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(135deg, rgba(0,122,255,.08), rgba(20,184,166,.08));
      border-bottom: 1px solid #E4E7EC;
    }
    .game-banner.show { display: flex; }
    .game-banner .game-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #007AFF, #14B8A6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #fff; flex-shrink: 0;
    }
    .game-banner .game-name { font-weight: 600; font-size: 13px; }
    .game-banner .game-genre { font-size: 11px; color: #6E6E73; }
    .game-banner .game-badge {
      margin-left: auto; font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 99px;
      background: rgba(52,199,89,.12); color: #34C759;
    }

    .section { padding: 14px 16px; }
    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: #6E6E73; font-weight: 600; margin-bottom: 10px;
    }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-row .label { font-size: 13px; font-weight: 500; }

    .toggle {
      width: 42px; height: 26px; border-radius: 13px;
      background: #E4E7EC; border: none; cursor: pointer;
      position: relative; transition: background 0.2s;
    }
    .toggle::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; transition: left 0.2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle.on { background: #007AFF; }
    .toggle.on::after { left: 19px; }

    .profile-card {
      background: #fff; border: 1px solid #E4E7EC; border-radius: 10px;
      padding: 12px; margin-top: 8px;
    }
    .profile-row { display: flex; justify-content: space-between; padding: 4px 0; }
    .profile-row .key { font-size: 12px; color: #6E6E73; }
    .profile-row .val { font-size: 12px; font-weight: 600; }

    .canvas-info {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; margin-top: 8px;
      background: rgba(0,122,255,.06); border-radius: 8px;
      font-size: 12px; color: #007AFF; font-weight: 500;
    }

    .btn {
      display: block; width: 100%; padding: 10px;
      border-radius: 10px; border: none; font-weight: 600;
      font-size: 13px; cursor: pointer; text-align: center;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #007AFF; color: #fff; }
    .btn-secondary { background: #F1F3F7; color: #1D1D1F; }

    .footer {
      padding: 12px 16px; border-top: 1px solid #E4E7EC;
      font-size: 11px; color: #6E6E73; text-align: center;
    }
    .footer a { color: #007AFF; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <span class="title">VisionAdapt</span>
    <span class="version">v1.0.0</span>
  </div>

  <div class="status-bar">
    <div class="pulse inactive" id="statusPulse"></div>
    <div>
      <div class="status-text" id="statusText">Not connected</div>
      <div class="status-sub" id="statusSub">Enable to start correcting</div>
    </div>
  </div>

  <div class="game-banner" id="gameBanner">
    <div class="game-icon" id="gameIcon">?</div>
    <div>
      <div class="game-name" id="gameName">Detecting game...</div>
      <div class="game-genre" id="gameGenre"></div>
    </div>
    <div class="game-badge" id="gameBadge">LIVE</div>
  </div>

  <div class="section">
    <div class="section-title">Correction</div>
    <div class="toggle-row">
      <span class="label">Color correction</span>
      <button class="toggle" id="toggleEnabled" aria-label="Enable color correction"></button>
    </div>
    <div class="toggle-row">
      <span class="label">Outline overlays</span>
      <button class="toggle on" id="toggleOverlays" aria-label="Enable outline overlays"></button>
    </div>
    <div class="canvas-info" id="canvasInfo" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M2 8h20M8 2v20"/></svg>
      <span id="canvasCount">0</span> game canvas(es) detected — shader correction active
    </div>
  </div>

  <div class="section" style="padding-top: 0;">
    <div class="section-title">Your Profile</div>
    <div class="profile-card">
      <div class="profile-row"><span class="key">Type</span><span class="val" id="pType">Not assessed</span></div>
      <div class="profile-row"><span class="key">Severity</span><span class="val" id="pSeverity">—</span></div>
      <div class="profile-row"><span class="key">Contrast</span><span class="val" id="pContrast">50%</span></div>
      <div class="profile-row"><span class="key">Outlines</span><span class="val" id="pOutline">2px</span></div>
    </div>
  </div>

  <div class="section" style="padding-top: 0;">
    <button class="btn btn-primary" id="btnTakeAssessment">Take Assessment</button>
    <button class="btn btn-secondary" id="btnOpenDashboard" style="margin-top: 8px;">Open Dashboard</button>
  </div>

  <div class="footer">
    <a href="#" id="linkDashboard">visionadapt.vercel.app</a> — See every game clearly
  </div>

  <script src="popup.js"></script>
</body>
</html>
